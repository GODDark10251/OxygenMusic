name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy scipy requests yt-dlp PyQt6

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name "OxygenMusic" oxygen_music.py

    - name: Create Release Archive
      run: |
        mkdir release_folder
        copy dist\OxygenMusic.exe release_folder\
        copy oxygen_music.py release_folder\
        Compress-Archive -Path release_folder\* -DestinationPath OxygenMusic-v1.0.2-Windows.zip

    - name: Release to GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: OxygenMusic-v1.0.2-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
